name: udienza-dashboard
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: udienza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: udienza
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udienza -d udienza"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      internal:
        # Unique name: metabase also joins "apps", where "postgres" is the
        # main stack's database.
        aliases: [udienza-postgres]

  metabase:
    image: metabase/metabase:v0.63.17.3
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: udienza
      MB_DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MB_DB_HOST: udienza-postgres
      MB_SITE_URL: https://${DASHBOARD_HOST:-dashboard.udienza.com}
      JAVA_TIMEZONE: UTC
      # Keep the JVM inside mem_limit on a shared, RAM-tight host.
      JAVA_OPTS: -Xmx640m -XX:+UseSerialGC
    mem_limit: 900m
    # No published port. Public traffic: Cloudflare Tunnel (Access) ->
    # shared Caddy :8080 on the "apps" network -> udienza-metabase:3000.
    networks:
      internal:
      apps:
        aliases: [udienza-metabase]

  ingest:
    build: ./ingest
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://udienza:${POSTGRES_PASSWORD}@postgres:5432/udienza
      AUDIO_FEED_URL: ${AUDIO_FEED_URL:-https://www.udienza.com/feed.xml}
      VIDEO_FEED_URL: ${VIDEO_FEED_URL:-https://www.udienza.com/feed-video.xml}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
    volumes:
      - ./examples:/app/data:ro
    networks: [internal]

  # One-shot, idempotent Metabase provisioning (data source, questions,
  # dashboard): docker compose run --rm metabase-setup
  metabase-setup:
    image: node:22-alpine
    profiles: [tools]
    depends_on: [metabase]
    environment:
      MB_URL: http://metabase:3000
      MB_API_KEY: ${MB_API_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command: ["node", "/scripts/metabase-setup.mjs"]
    networks: [internal]

networks:
  internal:
  # Shared network of the host's main stack (/opt/apps), where the Caddy
  # that cloudflared targets lives. Same pattern as postiz/twenty.
  apps:
    name: apps_apps
    external: true
volumes:
  postgres_data:
